baseURL = "https://konglong87.github.io"
author = "KongLong"
copyright = "Copyright © 2008–2099, KongLong and the sy; all rights reserved."
paginate = 5
languageCode = "zh"
#DefaultContentLanguage = "en"
enableInlineShortcodes = true
# Historical theme examples are not part of the personal blog. Existing static URLs are preserved.
ignoreFiles = ["exampleSite"]
# prevent build failures when using Hugo's Instagram shortcode due to deprecated Instagram API.
# See https://github.com/gohugoio/hugo/issues/7228#issuecomment-714490456
ignoreErrors = ["error-remote-getjson"]

# ------------------------------
theme = "hugo-paper"
themesDir = "vendor"
title = "🦖"
buildfuture = true

[params]
  mainSections = ['post']
  color = 'wheat'   # linen, wheat, gray, light

  twitter = 'konglong'
  github = 'konglong87'
  instagram = 'konglong'

 #avatar = 'https://img1.baidu.com/it/u=1682993514,2737209100&fm=253&fmt=auto&app=138&f=JPEG?w=902&h=500'
  #avatar = 'https://github.com/konglong87/konglong87.github.io/blob/main/blog/resources/_gen/images/avatar1.png?raw=true'
  avatar = '/profile/avatar.png'
  name = 'konglong🦖'
  bio = '❤️ KL 💑️ SY ❤️'
