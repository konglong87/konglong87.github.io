baseURL = "https://konglong87.github.io"
author = "KongLong"
copyright = "Copyright © 2008–2099, KongLong and the sy; all rights reserved."
paginate = 5
languageCode = "zh-CN"
#DefaultContentLanguage = "en"
enableInlineShortcodes = true
# Historical theme examples are not part of the personal blog. Existing static URLs are preserved.
ignoreFiles = ["exampleSite"]
# prevent build failures when using Hugo's Instagram shortcode due to deprecated Instagram API.
# See https://github.com/gohugoio/hugo/issues/7228#issuecomment-714490456
ignoreErrors = ["error-remote-getjson"]

# ------------------------------
theme = "hugo-paper"
themesDir = "vendor"
title = "🦖"
buildfuture = true

[params]
  mainSections = ['post']
  color = 'wheat'   # linen, wheat, gray, light

  twitter = 'konglong'
  github = 'konglong87'
  instagram = 'konglong'

 #avatar = 'https://img1.baidu.com/it/u=1682993514,2737209100&fm=253&fmt=auto&app=138&f=JPEG?w=902&h=500'
  #avatar = 'https://github.com/konglong87/konglong87.github.io/blob/main/blog/resources/_gen/images/avatar1.png?raw=true'
  avatar = '/profile/avatar.png'
  name = 'konglong🦖'
  bio = '❤️ KL 💑️ SY ❤️'
  description = 'KongLong 的公开项目、AI Skills、开发工具和实践记录。'
  seo_site_name = 'KongLong 的公开项目与 AI 实践'
  seo_author_name = 'KongLong'
  seo_author_url = 'https://github.com/konglong87'
  seo_default_image = '/profile/avatar.png'
  goatcounter_code = 'konglong87'

  [params.home_banner]
    kicker = 'KongLong 的公开项目与 AI 实践'
    slogan = '喜欢永不过时'
    subtitle = '公开项目、AI Skills、开发工具和实践记录'
    projects_label = '精选项目'
# ------------------------------

# needed to  render raw HTML (e.g. <sub>, <sup>, <kbd>, <mark>)
[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

[menu]
 [[menu.main]]
    identifier = 'projects'
    name = '精选项目'
    url = '/projects/'
    weight = 10
  [[menu.main]]
    identifier = 'about'
    name = '关于'
    url = '/about/'
    weight = 20
  [[menu.main]]
    identifier = 'together'
    name = '一起'
    url = '/together/'
    weight = 30
  [[menu.main]]
    identifier = 'contact'
    name = '联系'
    url = '/contact/'
    weight = 40


[taxonomies]
category = "categories"
tag = "tags"
series = "series"

[privacy]

  [privacy.vimeo]
    disabled = false
    simple = true

  [privacy.twitter]
    disabled = false
    enableDNT = false
    simple = true

  [privacy.instagram]
    disabled = false
    simple = false

  [privacy.youtube]
    disabled = false
    privacyEnhanced = false

[services]

  [services.instagram]
    disableInlineCSS = false

  [services.twitter]
    disableInlineCSS = false
